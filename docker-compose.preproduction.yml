name: saas-preproduction
x-api: &api
  build: .
  env_file: .env.preproduction.runtime
  environment:
    REQUIRE_VERIFIED_EMAIL_FOR_COMPANY: "true"
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_preproduction.py first}
      POSTGRES_DB: saas_preproduction
    volumes: ["database:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:15433:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U saas -d saas_preproduction"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
  backup:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "/scripts/backup_preproduction.sh"]
    volumes: ["./scripts:/scripts:ro", "./backups/preproduction:/backups"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  migrate:
    <<: *api
    env_file: .env.preproduction
    command: ["sh", "-c", "python -m backend.db_role ensure && DATABASE_URL=$$MIGRATION_DATABASE_URL alembic upgrade head && DATABASE_URL=$$MIGRATION_DATABASE_URL python -m backend.worker && python -m backend.db_role grant"]
  api:
    <<: *api
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      retrieval: {condition: service_healthy}
      opensearch: {condition: service_healthy}
    ports: ["127.0.0.1:18000:8000"]
  worker:
    <<: *api
    command: ["celery", "-A", "backend.worker.celery", "worker", "-Q", "celery", "--loglevel=WARNING", "--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      retrieval: {condition: service_healthy}
      opensearch: {condition: service_healthy}
  indexer:
    <<: *api
    command: ["celery", "-A", "backend.worker.celery", "worker", "-Q", "indexing", "--loglevel=WARNING", "--concurrency=1"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      retrieval: {condition: service_healthy}
      opensearch: {condition: service_healthy}
  beat:
    <<: *api
    command: ["celery", "-A", "backend.worker.celery", "beat", "--loglevel=WARNING", "--schedule=/tmp/celerybeat"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  retrieval:
    build: {context: ., dockerfile: Dockerfile.retrieval}
    env_file: [config/retrieval.cpu.env.example, .env.preproduction.models]
    environment:
      HF_HUB_OFFLINE: "1"
    volumes: ["models:/models:ro"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/ready')"], interval: 15s, timeout: 5s, retries: 10, start_period: 180s}
  model-download:
    profiles: ["model-setup"]
    build: {context: ., dockerfile: Dockerfile.retrieval}
    env_file: config/retrieval.cpu.env.example
    volumes: ["models:/models"]
    command: ["python", "scripts/download_rag_models.py"]
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["search:/usr/share/opensearch/data"]
    healthcheck: {test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"], interval: 15s, timeout: 5s, retries: 20}
  web:
    build: ./frontend
    ports: ["127.0.0.1:18080:80"]
    depends_on: [api]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:18025:8025"]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: ["artifacts:/data"]
  storage-init:
    <<: *api
    depends_on: [minio]
    command: ["python", "-m", "backend.storage_setup"]
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes: ["./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./scripts/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["127.0.0.1:19090:9090"]
  grafana:
    image: grafana/grafana:11.4.0
    environment: {GF_SECURITY_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD}"}
    volumes: ["./scripts/grafana:/etc/grafana/provisioning:ro", "grafana:/var/lib/grafana"]
    ports: ["127.0.0.1:13000:3000"]
  otel:
    image: otel/opentelemetry-collector:0.119.0
    command: ["--config=/etc/otel.yml"]
    volumes: ["./scripts/otel.yml:/etc/otel.yml:ro"]
volumes:
  models:
  search:
  database:
  redis:
  artifacts:
  grafana:
