services:
  api:
    restart: unless-stopped
    build: &backend_build
      context: .
      args:
        PIP_INDEX_URL: ${DOCKER_PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_DEFAULT_TIMEOUT: ${DOCKER_PIP_TIMEOUT:-120}
        PIP_RETRIES: ${DOCKER_PIP_RETRIES:-10}
    environment: &api_environment
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-saas_app}:${SAAS_APP_DB_PASSWORD:-saas_app}@postgres:5432/${POSTGRES_DB:-saas_agent}
      APP_DB_USER: ${APP_DB_USER:-saas_app}
      APP_DB_PASSWORD: ${SAAS_APP_DB_PASSWORD:-saas_app}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run python scripts/init_local_secrets.py}@redis:6379/0
      AUTO_CREATE_SCHEMA: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me-32-bytes}
      MAIL_DEBUG: ${MAIL_DEBUG:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-implementation@example.test}
      DEMO_MODE: "false"
      REQUIRE_VERIFIED_EMAIL_FOR_COMPANY: ${REQUIRE_VERIFIED_EMAIL_FOR_COMPANY:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      SKILL_RUNTIME_ENABLED: ${SKILL_RUNTIME_ENABLED:-false}
      SKILL_MAX_TOKENS: ${SKILL_MAX_TOKENS:-8000}
      OFFICIAL_WEB_ENABLED: ${OFFICIAL_WEB_ENABLED:-false}
      OFFICIAL_SEARCH_API_KEY: ${OFFICIAL_SEARCH_API_KEY:-}
      OFFICIAL_PRODUCTS: '${OFFICIAL_PRODUCTS:-{}}'
      OFFICIAL_WEB_TIMEOUT: ${OFFICIAL_WEB_TIMEOUT:-15}
      OFFICIAL_WEB_MAX_BYTES: ${OFFICIAL_WEB_MAX_BYTES:-500000}
      AGENT_MAX_ROUNDS: ${AGENT_MAX_ROUNDS:-20}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-2}
      AGENT_MAX_REPLANS: ${AGENT_MAX_REPLANS:-2}
      AGENT_TOKEN_BUDGET: ${AGENT_TOKEN_BUDGET:-120000}
      AGENT_CONTEXT_TOKENS: ${AGENT_CONTEXT_TOKENS:-12000}
      CHAT_CONTEXT_MODE: ${CHAT_CONTEXT_MODE:-off}
      CHAT_CONTEXT_TOKENS: ${CHAT_CONTEXT_TOKENS:-12000}
      CHAT_HISTORY_ENABLED: ${CHAT_HISTORY_ENABLED:-false}
      CHAT_MEMORY_ITEMS_ENABLED: ${CHAT_MEMORY_ITEMS_ENABLED:-false}
      CHAT_MEMORY_CANDIDATES_ENABLED: ${CHAT_MEMORY_CANDIDATES_ENABLED:-false}
      MODEL_MODE: ${MODEL_MODE:-deterministic}
      RAG_MODE: ${RAG_MODE:-mock}
      RETRIEVAL_INDEXING_ENABLED: ${RETRIEVAL_INDEXING_ENABLED:-${RAG_V3_INDEXING_ENABLED:-true}}
      RAG_PDF_ENABLED: ${RAG_PDF_ENABLED:-true}
      RAG_OFFICE_ENABLED: ${RAG_OFFICE_ENABLED:-true}
      RETRIEVAL_RELEVANCE_MODE: ${RETRIEVAL_RELEVANCE_MODE:-${RAG_V3_RELEVANCE_MODE:-rules}}
      RETRIEVAL_MIN_RERANK_SCORE: ${RETRIEVAL_MIN_RERANK_SCORE:-${RAG_V3_MIN_RERANK_SCORE:-0.5}}
      RETRIEVAL_SAME_LANGUAGE_MIN_EVIDENCE_SCORE: ${RETRIEVAL_SAME_LANGUAGE_MIN_EVIDENCE_SCORE:-${RAG_V3_SAME_LANGUAGE_MIN_EVIDENCE_SCORE:-0.5}}
      RETRIEVAL_EN_TO_ZH_MIN_EVIDENCE_SCORE: ${RETRIEVAL_EN_TO_ZH_MIN_EVIDENCE_SCORE:-${RAG_V3_EN_TO_ZH_MIN_EVIDENCE_SCORE:-0.35}}
      RETRIEVAL_ZH_TO_EN_MIN_EVIDENCE_SCORE: ${RETRIEVAL_ZH_TO_EN_MIN_EVIDENCE_SCORE:-${RAG_V3_ZH_TO_EN_MIN_EVIDENCE_SCORE:-0.35}}
      RETRIEVAL_MIXED_LANGUAGE_MIN_EVIDENCE_SCORE: ${RETRIEVAL_MIXED_LANGUAGE_MIN_EVIDENCE_SCORE:-${RAG_V3_MIXED_LANGUAGE_MIN_EVIDENCE_SCORE:-0.45}}
      RETRIEVAL_RELEASE: ${RETRIEVAL_RELEASE:-${RAG_V3_RELEASE:-evaluations/retrieval/release.json}}
      LOCAL_INDEXER_ENABLED: "false"
      MODEL_API_STYLE: ${MODEL_API_STYLE:-responses}
      LLM_MODE: ${LLM_MODE:-online}
      LLM_LOCAL_MODEL: ${LLM_LOCAL_MODEL:-}
      LLM_LOCAL_BASE_URL: ${LLM_LOCAL_BASE_URL:-}
      LLM_LOCAL_API_KEY: ${LLM_LOCAL_API_KEY:-}
      EMBEDDING_MODE: online
      RERANKER_MODE: online
      OPENSEARCH_URL: ${DOCKER_OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-saas-rag-v1}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-30}
      EMBEDDING_BASE_URL: ${DOCKER_EMBEDDING_BASE_URL:-http://retrieval:8010/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_REVISION: 7999e1d3359715c523056ef9478215996d62a620
      EMBEDDING_DIMENSIONS: 512
      KNOWLEDGE_INDEX_VERSION: ${KNOWLEDGE_INDEX_VERSION:-chunks-bge-cpu-v2}
      KNOWLEDGE_MIN_SIMILARITY: ${KNOWLEDGE_MIN_SIMILARITY:-0.35}
      RERANKER_BASE_URL: ${DOCKER_RERANKER_BASE_URL:-http://retrieval:8010/v1}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      RERANKER_REVISION: 2cfc18c9415c912f9d8155881c133215df768a70
      EXECUTION_MODE: ${EXECUTION_MODE:-inline}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"], interval: 10s, timeout: 5s, retries: 5}
  migrate:
    build: *backend_build
    environment:
      <<: *api_environment
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saas}:${SAAS_DB_PASSWORD:-saas}@postgres:5432/${POSTGRES_DB:-saas_agent}
    command: ["sh", "-c", "python -m backend.db_role ensure && DATABASE_URL=$$MIGRATION_DATABASE_URL alembic upgrade head && DATABASE_URL=$$MIGRATION_DATABASE_URL python -m backend.worker && python -m backend.db_role grant"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    profiles: ["agent"]
    build: *backend_build
    environment:
      <<: *api_environment
    command: ["celery", "-A", "backend.worker.celery", "worker", "-Q", "celery", "--loglevel=WARNING", "--concurrency=2"]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_started}
  indexer:
    restart: unless-stopped
    build: *backend_build
    environment:
      <<: *api_environment
    command: ["celery", "-A", "backend.worker.celery", "worker", "-Q", "indexing", "--loglevel=WARNING", "--concurrency=1"]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_started}
      retrieval: {condition: service_healthy, required: false}
      opensearch: {condition: service_healthy, required: false}
  beat:
    restart: unless-stopped
    build: *backend_build
    environment:
      <<: *api_environment
    command: ["celery", "-A", "backend.worker.celery", "beat", "--loglevel=WARNING", "--schedule=/tmp/celerybeat"]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_started}
  retrieval:
    restart: unless-stopped
    profiles: ["rag"]
    build: {context: ., dockerfile: Dockerfile.retrieval}
    env_file: config/retrieval.cpu.env.example
    environment:
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      HF_HUB_OFFLINE: "1"
    volumes: ["retrieval_models:/models:ro"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/ready')"], interval: 15s, timeout: 5s, retries: 10, start_period: 180s}
  model-download:
    profiles: ["model-setup"]
    build: {context: ., dockerfile: Dockerfile.retrieval}
    env_file: config/retrieval.cpu.env.example
    volumes: ["retrieval_models:/models"]
    command: ["python", "scripts/download_rag_models.py"]
  opensearch:
    restart: unless-stopped
    profiles: ["rag"]
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["search_data:/usr/share/opensearch/data"]
    healthcheck: {test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"], interval: 15s, timeout: 5s, retries: 20}
  web:
    restart: unless-stopped
    build: ./frontend
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:8080:80"]
    depends_on: [api]
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas}
      POSTGRES_PASSWORD: ${SAAS_DB_PASSWORD:-saas}
      POSTGRES_DB: ${POSTGRES_DB:-saas_agent}
      APP_DB_USER: ${APP_DB_USER:-saas_app}
      APP_DB_PASSWORD: ${SAAS_APP_DB_PASSWORD:-saas_app}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run python scripts/init_local_secrets.py}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes: ["redis_data:/data"]
    healthcheck: {test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'], interval: 5s, timeout: 3s, retries: 10}
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes: ["./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./scripts/alerts.yml:/etc/prometheus/alerts.yml:ro", "prometheus_data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.4.0
    volumes: ["grafana_data:/var/lib/grafana"]
    ports: ["127.0.0.1:3000:3000"]
volumes: {redis_data: {}, postgres_data: {}, retrieval_models: {}, search_data: {}, grafana_data: {}, prometheus_data: {}}
