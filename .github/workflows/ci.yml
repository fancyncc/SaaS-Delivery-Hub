name: Checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check backend tests scripts/evaluate_v3_demo.py scripts/record_v3_boundary_runs.py scripts/download_rag_models.py
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  browser:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      # These tests share tests/test.db and must run sequentially.
      - run: python -m pytest tests/test_browser_flow.py tests/test_browser_onboarding.py tests/test_agent_browser.py tests/test_chat_browser.py -q
        env:
          RUN_BROWSER_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: tests/artifacts
          if-no-files-found: ignore

  deploy-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/verify_deploy_failure_recovery.ps1
      - shell: pwsh
        run: ./scripts/verify_model_comparison_recovery.ps1
      - shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          foreach ($script in @('scripts/record_local_v3_evaluation.ps1','scripts/compare_local_v3_models.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors -join "`n") }
          }
