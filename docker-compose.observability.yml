# Optional tracing overlay for the existing development stack.
services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
  indexer:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
  beat:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
  grafana:
    volumes: ["./scripts/grafana:/etc/grafana/provisioning:ro"]
  otel:
    image: otel/opentelemetry-collector:0.119.0
    command: ["--config=/etc/otel.yml"]
    volumes: ["./scripts/otel.yml:/etc/otel.yml:ro"]
    depends_on: [tempo]
  tempo-init:
    image: grafana/tempo:2.7.1
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes: ["traces:/var/tempo"]
  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./scripts/tempo.yml:/etc/tempo.yml:ro", "traces:/var/tempo"]
    depends_on:
      tempo-init: {condition: service_completed_successfully}
volumes:
  traces:
