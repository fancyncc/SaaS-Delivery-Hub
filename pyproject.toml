[project]
name = "saas-implementation-agent"
version = "0.1.0"
description = "Project collaboration SaaS customer onboarding and implementation agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "markdown-it-py>=3,<5",
  "pypdf>=5,<7",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "alembic>=1.14",
  "redis>=5.2",
  "celery[redis]>=5.4,<6",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "boto3>=1.35,<2",
  "prometheus-client>=0.21,<1",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp>=1.28,<2",
]

[project.optional-dependencies]
rag-local = ["sentence-transformers>=5,<6", "transformers>=4.51,<6", "torch>=2.6,<3"]
agent = ["langgraph>=0.2", "langgraph-checkpoint-postgres>=2.0", "openai-agents>=0.0.7", "langfuse>=2.50"]
worker = ["celery[redis]>=5.4", "redis>=5.0"]
observability = ["opentelemetry-distro>=0.49b0", "opentelemetry-exporter-otlp>=1.28", "prometheus-client>=0.21"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13", "playwright>=1.50,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E402", "E501", "UP017"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
